[workspace]
resolver = "2"
members = ["crates/spm-pow", "crates/spm-proto", "crates/spm-fee", "crates/spm-gpu"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xXGuilasXx/spark-pearl-miner"
rust-version = "1.88"

[workspace.dependencies]
# Official Pearl reference (ISC) — pinned. Never bump without re-running the bit-exact suite.
zk-pow = { git = "https://github.com/pearl-research-labs/pearl", rev = "3fe226761a139a9652b8f28a6464a4bbc25986c8", package = "zk-pow" }
pearl-blake3 = { git = "https://github.com/pearl-research-labs/pearl", rev = "3fe226761a139a9652b8f28a6464a4bbc25986c8", package = "pearl-blake3", features = ["serde"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1.8"
primitive-types = { version = "0.12", features = ["serde"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
bech32 = "0.11"

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1
