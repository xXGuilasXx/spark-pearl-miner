[workspace]
resolver = "2"
members = [
    "crates/spm-pow",
    "crates/spm-proto",
    "crates/spm-fee",
    "crates/spm-gpu",
    "crates/spm-work",
    "crates/spm-ipc",
    "crates/spm-mockpool",
    "crates/spm-pool",
    "crates/spm-cpuref",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xXGuilasXx/spark-pearl-miner"
rust-version = "1.88"

[workspace.dependencies]
# Official Pearl reference (ISC) — pinned. Never bump without re-running the bit-exact suite.
zk-pow = { git = "https://github.com/pearl-research-labs/pearl", rev = "3fe226761a139a9652b8f28a6464a4bbc25986c8", package = "zk-pow" }
pearl-blake3 = { git = "https://github.com/pearl-research-labs/pearl", rev = "3fe226761a139a9652b8f28a6464a4bbc25986c8", package = "pearl-blake3", features = ["serde"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1.8"
primitive-types = { version = "0.12", features = ["serde"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
bech32 = "0.11"
# Host core (M4): async I/O, TLS with the ring provider only (no cmake/aws-lc build), proof encoders.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
zstd = "0.13"
flate2 = "1"
sha2 = "0.10"
tracing = "0.1"
rand = "0.9"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Workspace-internal crates.
spm-pow = { path = "crates/spm-pow" }
spm-proto = { path = "crates/spm-proto" }
spm-work = { path = "crates/spm-work" }
spm-ipc = { path = "crates/spm-ipc" }

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1
